<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>氣象與災害風險情報｜OpenData Lab</title>
<style>
:root{--nav:#101828;--bg:#f5f7fa;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--green:#059669;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:white;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:#98a2b3;line-height:1.6;margin-top:8px}.nav{margin-top:30px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px;border-radius:9px;text-align:left;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1d2939;color:#fff}
.main{padding:26px 30px 50px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:16px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px}.top h1{margin:5px 0 6px;font-size:28px}.muted{color:var(--muted);font-size:13px}.pill{background:#eef4ff;color:#1849a9;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700;height:fit-content}.notice{margin:18px 0;background:#fffaeb;border:1px solid #fedf89;padding:11px 14px;border-radius:10px;font-size:12px;color:#7a2e0e}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.site-card{background:#fff;border:1px solid var(--line);border-radius:12px}.stat{padding:16px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:6px}.panel{margin-top:14px;padding:16px}.filters{display:grid;grid-template-columns:1.5fr repeat(3,1fr) auto;gap:10px}.filters input,.filters select{border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff;width:100%}.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.site-card{padding:16px;cursor:pointer}.site-card:hover{box-shadow:0 8px 26px #10182812}.cardtop{display:flex;justify-content:space-between;gap:12px}.risk{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:800}.risk.low{background:#ecfdf3;color:#027a48}.risk.mid{background:#fffaeb;color:#b54708}.risk.high{background:#fef3f2;color:#b42318}.site-card h3{margin:2px 0 6px;font-size:16px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag{font-size:11px;background:#f2f4f7;padding:5px 8px;border-radius:999px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metrics div{background:#f8fafc;border-radius:8px;padding:9px}.metrics span{display:block;color:var(--muted);font-size:10px}.metrics b{font-size:13px}.alert{margin-top:12px;padding:10px;border-left:3px solid var(--amber);background:#fffaf0;font-size:12px}.bar{height:7px;background:#eef2f6;border-radius:999px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#2563eb}.drawerback{position:fixed;inset:0;background:#10182870}.drawer{position:fixed;right:0;top:0;width:min(540px,92vw);height:100vh;background:#fff;padding:26px;overflow:auto;box-shadow:-12px 0 30px #0002}.hidden{display:none}.close{float:right;border:0;background:#f2f4f7;width:36px;height:36px;border-radius:9px;cursor:pointer}.hazard{margin:12px 0}.hazardline{display:flex;justify-content:space-between;font-size:12px}.recommend{background:#eff8ff;border:1px solid #b2ddff;padding:12px;border-radius:10px;margin-top:16px;font-size:13px;line-height:1.7}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}}@media(max-width:600px){.grid,.filters{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.top{display:block}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand">OpenData Lab</div><div class="sub">Top 5 商業化原型<br>05｜氣象與災害風險情報</div><div class="nav"><button class="active">資產風險</button><button onclick="filterWatch()">高風險關注</button><button onclick="location.href='../'">企業商機雷達</button></div></aside>
<main class="main"><div class="top"><div><div class="eyebrow">WEATHER & HAZARD RISK INTELLIGENCE</div><h1>氣象與災害風險情報</h1><div class="muted">企業付費看的不是「會不會下雨」，而是這個工地、倉庫、農場或保單地址到底有多危險。</div></div><div class="pill">商業價值 88 / 100</div></div>
<div class="notice">MVP 示意版：風險分數與預警均為模擬資料，不可作為工程、保險或防災決策依據。正式版應串中央氣象署、空品、土石流、崩塌與災害潛勢資料。</div>
<div class="grid"><div class="stat"><span>監控資產</span><strong id="sTotal">0</strong></div><div class="stat"><span>高風險 ≥ 75</span><strong id="sHigh">0</strong></div><div class="stat"><span>48 小時警示</span><strong id="sAlert">0</strong></div><div class="stat"><span>平均風險</span><strong id="sAvg">0</strong></div></div>
<section class="panel"><div class="filters"><input id="q" placeholder="搜尋資產、地址或行政區"><select id="type"><option value="all">所有資產類型</option><option>工地</option><option>倉庫</option><option>農場</option><option>保單地址</option><option>太陽能場</option></select><select id="horizon"><option value="24">未來 24 小時</option><option value="48" selected>未來 48 小時</option><option value="72">未來 72 小時</option></select><select id="sort"><option value="risk">依總風險</option><option value="rain">依豪雨</option><option value="wind">依強風</option><option value="slide">依坡地災害</option></select><button class="btn" onclick="resetAll()">全部資產</button></div></section>
<div id="cards" class="cards"></div></main></div>
<div id="back" class="drawerback hidden" onclick="closeDrawer()"></div><aside id="drawer" class="drawer hidden"><button class="close" onclick="closeDrawer()">×</button><div id="drawerBody"></div></aside>
<script>
const sites=[
{id:1,n:"北投住宅工地 A",addr:"臺北市北投區大業路周邊",type:"工地",risk:82,rain:91,wind:58,slide:42,heat:36,air:25,alert:"48 小時內有短延時強降雨風險，建議檢查抽水、邊坡與材料覆蓋。"},
{id:2,n:"內湖物流倉庫",addr:"臺北市內湖區新湖一路周邊",type:"倉庫",risk:64,rain:72,wind:68,slide:8,heat:55,air:42,alert:"強風與大雨可能影響裝卸效率，建議調整戶外作業時段。"},
{id:3,n:"南港商辦工程",addr:"臺北市南港區經貿二路周邊",type:"工地",risk:71,rain:78,wind:64,slide:18,heat:51,air:35,alert:"未來 48 小時雨勢偏高，高空作業與吊掛需留意陣風。"},
{id:4,n:"文山山坡住宅保單群",addr:"臺北市文山區指南路周邊",type:"保單地址",risk:88,rain:86,wind:52,slide:94,heat:28,air:20,alert:"坡地災害潛勢高，豪雨期間應優先列入保全與損害監控。"},
{id:5,n:"士林高齡住宅保單群",addr:"臺北市士林區天母北路周邊",type:"保單地址",risk:48,rain:55,wind:46,slide:22,heat:61,air:31,alert:"整體風險中低，主要需關注高溫與短時強降雨。"},
{id:6,n:"桃園冷鏈物流中心",addr:"桃園市蘆竹區南崁路周邊",type:"倉庫",risk:76,rain:66,wind:84,slide:6,heat:63,air:48,alert:"陣風偏強，屋頂設施、招牌與大型車輛進出需留意。"},
{id:7,n:"宜蘭三星農場",addr:"宜蘭縣三星鄉行健村周邊",type:"農場",risk:85,rain:93,wind:72,slide:38,heat:22,air:14,alert:"累積雨量風險高，建議提前處理排水與採收排程。"},
{id:8,n:"嘉義太陽能場 B",addr:"嘉義縣布袋鎮沿海地區",type:"太陽能場",risk:79,rain:61,wind:92,slide:3,heat:77,air:36,alert:"沿海強風風險高，應關注模組固定、逆變器與輸配電設施。"}
];
let current=[...sites];const el=id=>document.getElementById(id);
function horizonRisk(s){const h=+el("horizon").value;return Math.min(99,Math.round(s.risk+(h===72?4:h===24?-4:0)))}
function level(v){return v>=75?"high":v>=55?"mid":"low"}
function render(){const q=el("q").value.trim(),t=el("type").value,sort=el("sort").value;current=sites.filter(s=>(!q||(s.n+s.addr+s.type).includes(q))&&(t==="all"||s.type===t));current.sort((a,b)=>sort==="rain"?b.rain-a.rain:sort==="wind"?b.wind-a.wind:sort==="slide"?b.slide-a.slide:horizonRisk(b)-horizonRisk(a));el("cards").innerHTML=current.map(s=>'<article class="site-card" onclick="openDrawer('+s.id+')"><div class="cardtop"><div><div class="eyebrow">'+s.type+'</div><h3>'+s.n+'</h3><div class="muted">'+s.addr+'</div></div><div class="risk '+level(horizonRisk(s))+'">'+horizonRisk(s)+'</div></div><div class="tags"><span class="tag">豪雨 '+s.rain+'</span><span class="tag">強風 '+s.wind+'</span><span class="tag">坡地 '+s.slide+'</span><span class="tag">高溫 '+s.heat+'</span></div><div class="metrics"><div><span>豪雨</span><b>'+s.rain+'</b></div><div><span>強風</span><b>'+s.wind+'</b></div><div><span>坡地</span><b>'+s.slide+'</b></div><div><span>空品</span><b>'+s.air+'</b></div></div><div class="alert">'+s.alert+'</div></article>').join("");stats()}
function stats(){el("sTotal").textContent=current.length;el("sHigh").textContent=current.filter(s=>horizonRisk(s)>=75).length;el("sAlert").textContent=current.filter(s=>Math.max(s.rain,s.wind,s.slide)>=80).length;el("sAvg").textContent=Math.round(current.reduce((a,s)=>a+horizonRisk(s),0)/(current.length||1))}
function hazardRow(name,v){return '<div class="hazard"><div class="hazardline"><span>'+name+'</span><b>'+v+' / 100</b></div><div class="bar"><i style="width:'+v+'%"></i></div></div>'}
function openDrawer(id){const s=sites.find(x=>x.id===id);el("drawerBody").innerHTML='<div class="eyebrow">'+s.type+'</div><h2>'+s.n+'</h2><p class="muted">'+s.addr+'</p><div class="risk '+level(horizonRisk(s))+'" style="width:74px;height:74px;font-size:27px">'+horizonRisk(s)+'</div><h3>風險拆解</h3>'+hazardRow("豪雨風險",s.rain)+hazardRow("強風風險",s.wind)+hazardRow("坡地災害",s.slide)+hazardRow("高溫風險",s.heat)+hazardRow("空氣品質",s.air)+'<div class="recommend"><b>建議行動</b><br>'+s.alert+'<br><br>正式產品可進一步提供地址批次評分、保單累積暴險、工地停工風險與 API。</div>';el("back").classList.remove("hidden");el("drawer").classList.remove("hidden")}
function closeDrawer(){el("back").classList.add("hidden");el("drawer").classList.add("hidden")}
function filterWatch(){el("q").value="";el("type").value="all";current=sites.filter(s=>horizonRisk(s)>=75);el("cards").innerHTML=current.map(s=>'<article class="site-card" onclick="openDrawer('+s.id+')"><div class="cardtop"><div><div class="eyebrow">'+s.type+'</div><h3>'+s.n+'</h3><div class="muted">'+s.addr+'</div></div><div class="risk high">'+horizonRisk(s)+'</div></div><div class="alert">'+s.alert+'</div></article>').join("");stats()}
function resetAll(){el("q").value="";el("type").value="all";render()}
["q","type","horizon","sort"].forEach(id=>el(id).addEventListener(id==="q"?"input":"change",render));render();
</script></body></html>
