name: Discover local parking upstream APIs

on:
  push:
    branches: ["main"]
    paths:
      - "停車/scripts/discover_local_parking_upstreams.py"
      - ".github/workflows/parking-upstream-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 "停車/scripts/discover_local_parking_upstreams.py"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "停車/地方停車上游反查.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Discover local parking upstream endpoints"
          git pull --rebase origin main
          git push origin HEAD:main
