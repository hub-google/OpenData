name: 測試政府標案情報平台

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tender-intelligence-web/index.html"
      - "tender-intelligence-web/styles.css"
      - "tender-intelligence-web/app.js"
      - "tender-intelligence-web/backend.js"
      - "tender-intelligence-web/delivery.js"
      - "tender-intelligence-web/advanced.js"
      - "tender-intelligence-web/developer-api.js"
      - "tender-intelligence-web/evidence.js"
      - "tender-intelligence-web/issues.js"
      - "tender-intelligence-web/operations.js"
      - "tender-intelligence-web/proposal.js"
      - "tender-intelligence-web/account-privacy.js"
      - "tender-intelligence-web/debarred.js"
      - "tender-intelligence-web/supabase/functions/**"
      - "tender-intelligence-web/supabase/migrations/**"
      - "tender-intelligence-web/core.mjs"
      - "tender-intelligence-web/search-expression.mjs"
      - "tender-intelligence-web/tests/**"
      - ".github/workflows/tender-intelligence-check.yml"

permissions:
  contents: read

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 讀取程式碼
        uses: actions/checkout@v4
      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 驗證 JavaScript 語法
        run: |
          node --check tender-intelligence-web/app.js
          node --check tender-intelligence-web/core.mjs
          node --check tender-intelligence-web/search-expression.mjs
          node --check tender-intelligence-web/backend.js
          node --check tender-intelligence-web/delivery.js
          node --check tender-intelligence-web/advanced.js
          node --check tender-intelligence-web/developer-api.js
          node --check tender-intelligence-web/evidence.js
          node --check tender-intelligence-web/issues.js
          node --check tender-intelligence-web/operations.js
          node --check tender-intelligence-web/proposal.js
          node --check tender-intelligence-web/account-privacy.js
          node --check tender-intelligence-web/debarred.js
          node --check tender-intelligence-web/support.js
      - name: 安裝 Deno 執行環境
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 驗證 Supabase Edge Function 語法
        run: |
          for file in tender-intelligence-web/supabase/functions/ti-*/index.ts; do
            deno check "$file"
          done
      - name: 執行資料解析及安全性單元測試
        run: node --test tender-intelligence-web/tests/*.test.mjs
      - name: 驗證網頁參照的檔案存在
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("tender-intelligence-web")
          html=(root/"index.html").read_text(encoding="utf-8")
          assert '<script type="module" src="./app.js"></script>' in html
          assert '<link rel="stylesheet" href="./styles.css">' in html
          assert '<script type="module" src="./delivery.js"></script>' in html
          assert '<script type="module" src="./advanced.js"></script>' in html
          assert (root/"search-expression.mjs").is_file()
          assert '<script type="module" src="./operations.js"></script>' in html
          assert '<script type="module" src="./proposal.js"></script>' in html
          assert '<script type="module" src="./account-privacy.js"></script>' in html
          assert '<script type="module" src="./debarred.js"></script>' in html
          assert '<script type="module" src="./support.js"></script>' in html
          assert '<link rel="stylesheet" href="./support.css">' in html
          assert 'id="view-debarred"' in html
          assert 'id="accountDeleteForm"' in html
          assert 'id="view-proposal"' in html
          for view in ('decisions','contracts','directory','guide'):
              assert f'id="view-{view}"' in html,view
          assert 'id="view-advanced"' in html
          for key in ('issues','developer'):
              assert f'id="view-{key}"' in html,key
          assert '<script type="module" src="./issues.js"></script>' in html
          assert '<script type="module" src="./developer-api.js"></script>' in html
          assert '<script type="module" src="./evidence.js"></script>' in html
          for marker in ('verifiedMetrics','verifiedLatest','verifiedOpen','verifiedSoon','verifiedUnknown',
                         'advDeadlineStart','advDeadlineEnd','radarFullSearch','radarFullResults',
                         'knowledgeSearchForm','knowledgeResults','trackingXlsx'):
              assert f'id="{marker}"' in html,marker
          for f in ("app.js","styles.css","core.mjs","backend.js","delivery.js","advanced.js","issues.js","developer-api.js","evidence.js","operations.js","proposal.js","account-privacy.js","debarred.js","support.js","support.css"):
              assert (root/f).is_file(),f
          print("OK: required assets exist")
          PY
