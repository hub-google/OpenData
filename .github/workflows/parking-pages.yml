name: Publish parking page

on:
  push:
    branches: ["main"]
    paths:
      - "停車/**"
      - ".github/workflows/parking-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "parking-pages-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Publish parking site
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages

            rm -rf 停車
            mkdir -p 停車
            cp -R ../source/停車/. 停車/
            rm -rf 停車/scripts
            touch .nojekyll

            git add -A 停車 .nojekyll
            if git diff --cached --quiet; then
              echo "No parking changes"
              exit 0
            fi

            git commit -m "Publish parking page"
            if git push --force-with-lease origin HEAD:gh-pages; then
              exit 0
            fi

            echo "Push raced with another publisher; retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to publish parking page after retries" >&2
          exit 1
