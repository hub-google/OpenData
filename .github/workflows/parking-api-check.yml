name: Check parking public APIs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/parking-api-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test parking APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          urls = {
            "taipei_static": "https://tcgbusfs.blob.core.windows.net/blobtcmsv/TCMSV_alldesc.json",
            "taipei_realtime": "https://tcgbusfs.blob.core.windows.net/blobtcmsv/TCMSV_allavailable.json",
            "ntpc_static": "https://data.ntpc.gov.tw/api/datasets/b1464ef0-9c7c-4a6f-abf7-6bdf32847e68/json?page=0&size=2000",
            "ntpc_realtime": "https://data.ntpc.gov.tw/api/datasets/e09b35a5-a738-48cc-b0f5-570b67ad9c78/json?page=0&size=2000",
            "taoyuan": "https://opendata.tycg.gov.tw/api/dataset/f4cc0b12-86ac-40f9-8745-885bddc18f79/resource/0381e141-f7ee-450e-99da-2240208d1773/download",
          }
          for name, url in urls.items():
              req=urllib.request.Request(url, headers={"User-Agent":"OpenData-Parking-Checker/1.0","Origin":"https://hub-google.github.io"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw=r.read()
                      cors=r.headers.get("Access-Control-Allow-Origin")
                      ct=r.headers.get("Content-Type")
                      print(f"{name}: status={r.status} bytes={len(raw)} cors={cors!r} content_type={ct!r}")
                      data=json.loads(raw.decode("utf-8-sig"))
                      if isinstance(data,list): count=len(data); sample=data[0] if data else {}
                      elif isinstance(data,dict):
                          arr=(data.get("data") or {}).get("park") if isinstance(data.get("data"),dict) else None
                          if isinstance(arr,list): count=len(arr); sample=arr[0] if arr else {}
                          else: count=len(data); sample=data
                      else: count=-1; sample={}
                      print(f"{name}: json_ok count={count} sample_keys={list(sample)[:15] if isinstance(sample,dict) else type(sample).__name__}")
              except Exception as e:
                  print(f"{name}: ERROR {type(e).__name__}: {e}")
          site = "https://hub-google.github.io/OpenData/%E5%81%9C%E8%BB%8A/"
          with urllib.request.urlopen(site, timeout=30) as r:
              html = r.read().decode("utf-8", errors="replace")
              print(f"public_site: status={r.status} bytes={len(html)}")
              assert "NO DEMO DATA" in html
              assert "UX Demo" not in html
              assert "定位並查附近" in html
              assert "ntpc-realtime.json" in html
              assert "官方 API 直連" in html
          with urllib.request.urlopen(site + "data/meta.json", timeout=30) as r:
              live_meta = json.loads(r.read().decode("utf-8"))
              print("public_meta:", json.dumps(live_meta, ensure_ascii=False))
              assert live_meta["sources"]["taipei-static.json"]["count"] >= 1000
              assert live_meta["sources"]["taipei-realtime.json"]["count"] >= 500
              assert live_meta["sources"]["ntpc-static.json"]["count"] >= 100
              assert live_meta["sources"]["ntpc-realtime.json"]["count"] >= 50
              assert live_meta["sources"]["taoyuan.json"]["count"] >= 100
          PY
