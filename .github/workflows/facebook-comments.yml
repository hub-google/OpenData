name: Facebook comment diagnostic

on:
  push:
    paths:
      - 'experiments/facebook-comments/**'
      - '.github/workflows/facebook-comments.yml'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run diagnostic
        env:
          TARGET_URL: https://www.facebook.com/chiangwanan/posts/pfbid0evMdVBKwyEsdgsoPZEfWj1PERJfQZNEGtATLVLYoyVShwonSRQnSmL1ntKY2L68Fl
        run: python experiments/facebook-comments/diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-comment-diagnostic
          path: fb_diag
          retention-days: 7
