name: PPSTRQ Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ppstrq-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect public query page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ppstrq.nat.gov.tw/pps/pubQuery/PropertyQuery/propertyQuery.do'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          curl --fail-with-body --location --silent --show-error             --connect-timeout 15 --max-time 30             -A "$UA" -c cookies.txt -D headers.txt "$URL" -o page.html

          echo '=== response headers ==='
          sed -n '1,80p' headers.txt
          echo '=== form / input / script markers ==='
          python3 - <<'PY'
          from html.parser import HTMLParser

          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag in {'form','input','button','select','option','script'}:
                      d=dict(attrs)
                      if tag == 'script' and not d.get('src'):
                          return
                      print(tag, d)

          text=open('page.html','r',encoding='utf-8',errors='replace').read()
          print('HTML_BYTES', len(text.encode('utf-8')))
          p=P(); p.feed(text)
          PY

          echo '=== likely endpoint strings in HTML ==='
          grep -Eo '([A-Za-z0-9_./-]+\.do([?][^"''' <]*)?|[A-Za-z0-9_./-]+\.js)' page.html             | sort -u | head -n 200 || true
