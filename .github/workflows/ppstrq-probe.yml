name: PPSTRQ Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ppstrq-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PPSTRQ query, paging, and detail functions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q requests beautifulsoup4

          python3 - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          URL='https://ppstrq.nat.gov.tw/pps/pubQuery/PropertyQuery/propertyQuery.do'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          s=requests.Session()
          s.headers.update({'User-Agent':UA})
          r=s.get(URL,timeout=30)
          r.raise_for_status()

          soup=BeautifulSoup(r.text,'html.parser')
          form=soup.find('form',id='queryForm')
          action=urljoin(r.url,form.get('action',''))

          def base_data(form):
              d={}
              for el in form.find_all(['input','select','textarea']):
                  name=el.get('name')
                  if not name:
                      continue
                  typ=(el.get('type') or '').lower()
                  if typ in {'button','submit','reset','radio','checkbox'}:
                      continue
                  d[name]=el.get('value','')
              return d

          data=base_data(form)
          data.update({
              'method':'query',
              'currentPage':'0',
              'debtorType':'1',
              'debtorTypeRadio':'1',
              'queryDebtorName':'杰',
              'queryDebtorNo':'',
              'creditorType':'',
              'queryCreditorName':'',
              'queryCreditorNo':'',
          })

          r2=s.post(action,data=data,headers={'Referer':r.url},timeout=45)
          r2.raise_for_status()
          soup2=BeautifulSoup(r2.text,'html.parser')

          print('QUERY_BYTES',len(r2.content))
          m=re.search(r'此查詢總筆數：\s*([0-9,]+)筆',r2.text)
          print('TOTAL_MATCH',m.group(1) if m else None)
          cp=soup2.find('input',{'name':'currentPage'})
          tp=soup2.find('input',{'name':'totalPage'})
          print('CURRENT_PAGE',cp.get('value') if cp else None,'TOTAL_PAGE',tp.get('value') if tp else None)

          print('=== FIRST RESULT ROWS ===')
          rows=[]
          for tr in soup2.find_all('tr'):
              onclick=tr.get('onclick','')
              if 'goDetail' in onclick:
                  cells=[' '.join(x.stripped_strings) for x in tr.find_all(['td','th'])]
                  print(json.dumps({'onclick':onclick,'cells':cells},ensure_ascii=False))
                  rows.append((onclick,cells))
          print('RESULT_ROW_COUNT_ON_PAGE',len(rows))

          print('=== INLINE FUNCTION BODIES ===')
          raw=r2.text
          for fn in ['showList','gotoPage','goDetail','show']:
              # non-greedy through the next closing brace is enough for these short functions
              mm=re.search(r'function\s+'+re.escape(fn)+r'\s*\([^)]*\)\s*\{.*?\n\s*\}',raw,re.S)
              print('FUNCTION',fn)
              print(mm.group(0)[:4000] if mm else 'NOT_FOUND')

          print('=== HIDDEN FIELDS AFTER QUERY ===')
          qf=soup2.find('form',id='queryForm')
          for n in ['method','regUnitCode','certificateAppNoWord','currentPage','totalPage','debtorType','creditorType','struts.token','struts.token.name']:
              el=qf.find(attrs={'name':n}) if qf else None
              print(n,repr(el.get('value') if el else None))
          PY
