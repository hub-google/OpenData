name: PPSTRQ Sample

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ppstrq-probe.yml'

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch 100 public company/business cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q requests beautifulsoup4
          python3 ppstrq/scrape_sample.py

      - name: Commit sample data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ppstrq/data/sample_100_company_records.csv ppstrq/data/sample_100_company_records.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: add 100-record PPSTRQ public sample"
            git push
          fi
