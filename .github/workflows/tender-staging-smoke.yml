name: Tender D1 staging smoke test (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tender-staging-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify staging Worker and public HF connectivity
        env:
          API: https://monsterport-ti-hf-staging.ber-at.workers.dev
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          api=os.environ['API']
          req=urllib.request.Request(api+'/health',headers={'Accept':'application/json','User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/157 Safari/537.36'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
                  assert r.status==200
          except urllib.error.HTTPError as ex:
              print('STAGING_HTTP_STATUS='+str(ex.code))
              print('STAGING_HTTP_HEADERS='+str(ex.headers))
              print('STAGING_HTTP_BODY='+ex.read(1500).decode('utf-8','replace'))
              raise
          assert data['service']=='tender-hf-d1', data
          assert data['production_ready'] is False, data
          print('STAGING_HEALTH='+json.dumps(data,ensure_ascii=False))
          with urllib.request.urlopen(urllib.request.Request(api+'/preview/search?mode=latest&page=1',headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/157 Safari/537.36'}),timeout=30) as r:
              result=json.load(r)
              assert r.status==200
              assert isinstance(result['rows'],list)
              assert isinstance(result['total'],int)
              print('STAGING_SEARCH_CONTRACT_OK='+str(result['total']))
          request=urllib.request.Request(api+'/preview/search',data=b'{}',method='POST',headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/157 Safari/537.36'})
          try:
              urllib.request.urlopen(request,timeout=30)
              raise AssertionError('POST unexpectedly permitted')
          except urllib.error.HTTPError as error:
              assert error.code==405
          print('READ_ONLY_ACCESS_CONTROL_OK')
          with urllib.request.urlopen('https://huggingface.co/datasets/hub-google/TenderIntelligence/resolve/main/latest.json',timeout=30) as r:
              meta=json.load(r)
              assert meta['remote_sha256_verified'] is True
              print('HF_PUBLIC_REPOSITORY_ACCESS_OK')
          PY
