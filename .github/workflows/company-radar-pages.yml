name: Publish Company Radar branch

on:
  push:
    branches: ["main"]
    paths:
      - "company-radar-web/**"
      - ".github/workflows/company-radar-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "company-radar-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p /tmp/company-radar-site
          cp -R company-radar-web/. /tmp/company-radar-site/
          touch /tmp/company-radar-site/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R /tmp/company-radar-site/. .
          git add .
          git commit -m "Publish Company Radar web"
          git push --force origin gh-pages
