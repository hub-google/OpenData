name: 標案工作區三帳號權限驗收

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["發布政府標案情報平台"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
jobs:
  three-account-rls:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Real three-account workspace and role permissions audit
        run: node tender-intelligence-web/tests/workspace-rls-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tender-team-rls-evidence
          path: tender-intelligence-web/audits/workspace/
          if-no-files-found: warn
