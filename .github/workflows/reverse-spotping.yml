name: Reverse SpotPing sources
on:
  push:
    branches: ["main"]
    paths:
      - "停車/scripts/reverse_spotping.py"
      - ".github/workflows/reverse-spotping.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 "停車/scripts/reverse_spotping.py"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "停車/SpotPing來源反查.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reverse SpotPing sources"
          git pull --rebase origin main
          git push origin HEAD:main
