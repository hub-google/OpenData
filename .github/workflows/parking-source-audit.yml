name: Audit nationwide free parking sources

on:
  push:
    branches: ["main"]
    paths:
      - "停車/scripts/audit_sources.py"
      - ".github/workflows/parking-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parking-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run nationwide source audit
        run: python3 "停車/scripts/audit_sources.py"

      - name: Commit audit markdown
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "停車/全台縣市停車API盤點.md"
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Update nationwide parking API audit"
          git pull --rebase origin main
          git push origin HEAD:main
