name: Probe QParking API
on:
  push:
    branches: ["main"]
    paths:
      - "停車/scripts/probe_qparking_api.py"
      - ".github/workflows/probe-qparking-api.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 "停車/scripts/probe_qparking_api.py"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "停車/QParkingAPI實測.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe QParking API"
          git pull --rebase origin main
          git push origin HEAD:main
