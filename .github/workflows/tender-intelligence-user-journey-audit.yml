name: 標案網站真實操作稽核（公開頁面）

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["發布政府標案情報平台"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: write

jobs:
  live-click-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝真實瀏覽器測試環境
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: 操作公開正式網站並保存證據
        run: node tender-intelligence-web/tests/user-journey-live.cjs
      - name: 發布獨立稽核報告分支（不修改產品主程式）
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tender-audit-export
          cp tender-intelligence-web/audits/2026-11-05-live-click-audit.* /tmp/tender-audit-export/ 2>/dev/null || true
          if [ ! -f /tmp/tender-audit-export/2026-11-05-live-click-audit.json ]; then
            echo '{"error":"Browser tests could not start; inspect GitHub Actions logs."}' > /tmp/tender-audit-export/2026-11-05-live-click-audit.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan tender-ui-audit-results-20261105
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p tender-intelligence-web/audits
          cp /tmp/tender-audit-export/* tender-intelligence-web/audits/
          git add tender-intelligence-web/audits/
          git commit -m "Report real anonymous tender website user-journey audit"
          git push -f origin HEAD:refs/heads/tender-ui-audit-results-20261105
