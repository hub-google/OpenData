name: Reverse QParking backend
on:
  push:
    branches: ["main"]
    paths:
      - "停車/scripts/reverse_qparking.py"
      - ".github/workflows/reverse-qparking.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 "停車/scripts/reverse_qparking.py"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "停車/QParking上游反查.md"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reverse QParking backend"
          git pull --rebase origin main
          git push origin HEAD:main
