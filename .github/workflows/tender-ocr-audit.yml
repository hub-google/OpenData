name: 標案 OCR 掃描文件真實瀏覽器測試

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tender-ocr-audit.yml"
      - "tender-intelligence-web/app.js"
      - "tender-intelligence-web/index.html"
      - "tender-intelligence-web/ocr-client.js"
      - "tender-intelligence-web/tests/ocr-live.cjs"
permissions:
  contents: read
jobs:
  real-local-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and PDF image fixture builder
        run: |
          npm install --no-save playwright@1.58.2 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Test real Tesseract on scanned PDF and PNG
        run: node tender-intelligence-web/tests/ocr-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ocr-evidence
          path: tender-intelligence-web/audits/ocr/
          if-no-files-found: warn
