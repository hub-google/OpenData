name: linepay-apk-probe

on:
  push:
    branches:
      - tmp-linepay-apk-probe-20261005

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Aurora auth exactly like official app
        run: |
          set -euxo pipefail
          mkdir -p analysis
          cat > analysis/device.json <<'JSON'
          {
            "UserReadableName":"Google Pixel 7a",
            "Build.HARDWARE":"lynx",
            "Build.RADIO":"unknown",
            "Build.FINGERPRINT":"google/lynx/lynx:14/UQ1A.240205.002/11224170:user/release-keys",
            "Build.BRAND":"google",
            "Build.DEVICE":"lynx",
            "Build.VERSION.SDK_INT":"34",
            "Build.VERSION.RELEASE":"14",
            "Build.MODEL":"Pixel 7a",
            "Build.MANUFACTURER":"Google",
            "Build.PRODUCT":"lynx",
            "Build.ID":"UQ1A.240205.002",
            "Build.BOOTLOADER":"lynx-1.0",
            "TouchScreen":"3",
            "Keyboard":"1",
            "Navigation":"1",
            "ScreenLayout":"2",
            "HasHardKeyboard":"false",
            "HasFiveWayNavigation":"false",
            "Screen.Density":"420",
            "Screen.Width":"1080",
            "Screen.Height":"2400",
            "Platforms":"arm64-v8a,armeabi-v7a",
            "Features":"",
            "Locales":"en_US,zh_TW",
            "SharedLibraries":"",
            "GL.Version":"196610",
            "GL.Extensions":"",
            "Client":"android-google",
            "GSF.version":"245000000",
            "Vending.version":"84022600",
            "Vending.versionString":"45.2.26-23",
            "Roaming":"mobile-notroaming",
            "TimeZone":"Asia/Taipei",
            "CellOperator":"466",
            "SimOperator":"92"
          }
          JSON
          for ua in             'com.aurora.store-4.8.4-76'             'com.aurora.store-4.8.3-75'             'com.aurora.store-4.7.4-65'
          do
            echo "===== UA $ua ====="
            curl -sS -D - -o "analysis/body-$(echo "$ua"|tr .- _).txt" \
              -A "$ua" -H 'Content-Type: application/json' \
              --data-binary @analysis/device.json \
              'https://auroraoss.com/api/auth' || true
            echo '--- body ---'
            cat "analysis/body-$(echo "$ua"|tr .- _).txt" || true
            echo
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-auth-probe
          path: analysis/
          retention-days: 1
