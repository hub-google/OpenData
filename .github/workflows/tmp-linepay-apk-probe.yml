name: linepay-apk-probe

on:
  push:
    branches:
      - tmp-linepay-apk-probe-20261005

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect MyAndroid Firefox extension
        run: |
          set -euxo pipefail
          mkdir -p analysis/ext
          URL='https://addons.mozilla.org/firefox/downloads/file/4237400/android_emulator_myandroid-1.1.3.xpi'
          curl -fL --retry 2 -A 'Mozilla/5.0' "$URL" -o analysis/myandroid.xpi
          file analysis/myandroid.xpi
          ls -lh analysis/myandroid.xpi
          unzip -q analysis/myandroid.xpi -d analysis/ext
          echo '===== FILES ====='
          find analysis/ext -maxdepth 4 -type f -printf '%p %s\n' | sort
          echo '===== MANIFEST ====='
          cat analysis/ext/manifest.json || true
          echo
          echo '===== URL / API HITS ====='
          grep -RniE 'https?://|apkid|stream\.myandroid|myandroid\.org|apkonline|emulator|iframe|launch|run.*apk|connector|websock|vnc' analysis/ext | head -n 10000 || true

      - name: Upload extension inspection
        uses: actions/upload-artifact@v4
        with:
          name: myandroid-firefox-extension
          path: analysis/ext/
          retention-days: 1
