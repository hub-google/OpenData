name: linepay-apk-probe

on:
  push:
    branches:
      - tmp-linepay-apk-probe-20261005

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect MyAndroid emulator API
        run: |
          set -euxo pipefail
          mkdir -p analysis/ext analysis/site
          XPI='https://addons.mozilla.org/firefox/downloads/file/4237400/android_emulator_myandroid-1.1.3.xpi'
          curl -fL -A 'Mozilla/5.0' "$XPI" -o analysis/myandroid.xpi
          unzip -q analysis/myandroid.xpi -d analysis/ext

          echo '===== myandrs.js ====='
          sed -n '1,280p' analysis/ext/myandrs.js
          echo '===== js/index.js ====='
          sed -n '1,220p' analysis/ext/js/index.js

          for url in             'https://www.myandroid.org/run/start.php'             'https://www.myandroid.org/run/start_extension.php'             'https://www.myandroid.org/android-emulator-online/'
          do
            echo "===== FETCH $url ====="
            name=$(echo "$url" | sha256sum | cut -c1-12)
            curl -L --connect-timeout 20 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' -D "analysis/site/$name.headers" "$url" -o "analysis/site/$name.html" || true
            echo '-- headers --'
            cat "analysis/site/$name.headers" || true
            echo '-- html head --'
            head -c 120000 "analysis/site/$name.html" || true
            echo
          done

          echo '===== ALL ENDPOINTS / JS REFERENCES ====='
          grep -RhoE 'https?://[^"'"'"' <>]+' analysis/site analysis/ext | sort -u | head -n 2000 || true
          grep -RniE 'websocket|wss:|novnc|vnc|session|token|start|android|stream|iframe|ajax|fetch\(|XMLHttpRequest|\.php' analysis/site | head -n 5000 || true

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: myandroid-api-inspection
          path: |
            analysis/ext/myandrs.js
            analysis/ext/js/index.js
            analysis/site/
          retention-days: 1
