name: linepay-apk-probe

on:
  push:
    branches:
      - tmp-linepay-apk-probe-20261005

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect LINE Pay MyAndroid app page
        run: |
          set -euxo pipefail
          mkdir -p analysis
          URL='https://www.myandroid.org/apps/com-linepaytw-upay'
          curl -fL --retry 2 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' "$URL" -o analysis/page.html
          echo '===== SIZE ====='
          wc -c analysis/page.html
          echo '===== LINEPAY/PACKAGE/RUN CONTEXT ====='
          grep -n -C 8 -Ei 'com\.linepaytw\.upay|run this app|run online|start\.php|start_extension|android-emulator|apkid|filepath|onclick|button|form|href=' analysis/page.html | head -n 5000 || true
          echo '===== SCRIPT SOURCES ====='
          grep -oE '<script[^>]+src=[^ >]+' analysis/page.html | head -n 500 || true
          echo '===== INLINE JS HINTS ====='
          grep -n -C 5 -Ei 'window\.open|location\.|fetch\(|XMLHttpRequest|ajax|apkid|filepath|run/' analysis/page.html | head -n 3000 || true

      - name: Upload page
        uses: actions/upload-artifact@v4
        with:
          name: myandroid-linepay-page
          path: analysis/page.html
          retention-days: 1
