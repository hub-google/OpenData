name: linepay-apk-probe

on:
  push:
    branches:
      - tmp-linepay-apk-probe-20261005

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect MyAndroid launcher extension
        run: |
          set -euxo pipefail
          mkdir -p analysis/ext
          ID='npcbllnmpghkdjeaocappkiedkiljhgk'
          URL="https://clients2.google.com/service/update2/crx?response=redirect&prodversion=140.0.0.0&acceptformat=crx2,crx3&x=id%3D$ID%26uc"
          curl -fL --retry 2 -A 'Mozilla/5.0' "$URL" -o analysis/myandroid.crx
          file analysis/myandroid.crx
          unzip -q analysis/myandroid.crx -d analysis/ext || true
          echo '===== FILES ====='
          find analysis/ext -maxdepth 3 -type f -printf '%p %s\n' | sort
          echo '===== MANIFEST ====='
          cat analysis/ext/manifest.json || true
          echo
          echo '===== URL / API HITS ====='
          grep -RniE 'https?://|apkid|stream\.myandroid|apkonline|emulator|iframe|launch|run.*apk|connector' analysis/ext | head -n 5000 || true

      - name: Upload extension inspection
        uses: actions/upload-artifact@v4
        with:
          name: myandroid-extension-inspection
          path: |
            analysis/ext/
          retention-days: 1
