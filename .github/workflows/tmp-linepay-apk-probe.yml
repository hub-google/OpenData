name: linepay-apk-probe

on:
  push:
    branches:
      - tmp-linepay-apk-probe-20261005

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query ApkOnline internal APK search
        run: |
          set -euxo pipefail
          mkdir -p analysis
          URL='https://www.apkonline.net/phpextensions/apksearch/connectorapksearch.php?q=com.linepaytw.upay'
          curl -fL --retry 2 --connect-timeout 20 -A 'Mozilla/5.0' "$URL" -o analysis/apkonline-search.html
          echo '===== RESPONSE SIZE ====='
          wc -c analysis/apkonline-search.html
          echo '===== RESPONSE ====='
          cat analysis/apkonline-search.html
          echo
          echo '===== LINKS ====='
          grep -oE 'https?://[^"<> ]+' analysis/apkonline-search.html | sort -u || true
          echo '===== HREFS ====='
          grep -oE 'href="[^"]+"' analysis/apkonline-search.html | sort -u || true

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: apkonline-search
          path: analysis/apkonline-search.html
          retention-days: 1
