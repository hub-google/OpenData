name: linepay-apk-probe

on:
  push:
    branches:
      - tmp-linepay-apk-probe-20261005

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest Aurora Store APK from F-Droid
        run: |
          set -euxo pipefail
          mkdir -p analysis
          curl -fsSL 'https://f-droid.org/api/v1/packages/com.aurora.store' -o /tmp/aurora.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/aurora.json'))
          print(json.dumps(d, indent=2)[:4000])
          # API shapes have changed; collect likely apkName fields recursively
          def walk(x):
              if isinstance(x, dict):
                  for k,v in x.items():
                      if k == 'apkName' and isinstance(v,str):
                          print('APKNAME='+v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          PY
          VC=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/aurora.json'))
          print(d['suggestedVersionCode'])
          PY
          )
          APKNAME="com.aurora.store_${VC}.apk"
          echo "APKNAME=$APKNAME"
          curl -fL "https://f-droid.org/repo/$APKNAME" -o analysis/aurora.apk
          ls -lh analysis/aurora.apk
          sha256sum analysis/aurora.apk

      - name: Boot Android and inspect Aurora onboarding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eux
            adb install analysis/aurora.apk
            adb shell monkey -p com.aurora.store -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml analysis/aurora-onboarding.xml || true
            adb exec-out screencap -p > analysis/aurora-onboarding.png
            echo '===== CURRENT ACTIVITY ====='
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            echo '===== UI XML ====='
            cat analysis/aurora-onboarding.xml || true
            echo '===== PACKAGE ====='
            adb shell dumpsys package com.aurora.store | grep -E 'versionName|versionCode|Activity Resolver|scheme|BROWSABLE' -A4 -B2 | head -n 2000 || true

      - name: Upload emulator inspection
        uses: actions/upload-artifact@v4
        with:
          name: aurora-onboarding
          path: |
            analysis/aurora-onboarding.xml
            analysis/aurora-onboarding.png
          retention-days: 1
