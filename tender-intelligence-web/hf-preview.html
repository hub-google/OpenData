<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>標案情報｜Hugging Face 公開資料測試入口</title>
<meta name="robots" content="noindex">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#1d1d1f;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e5ea;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a{color:#0066cc;text-decoration:none}a:hover{text-decoration:underline}header strong{font-size:17px}
main{max-width:1080px;margin:32px auto;padding:0 18px 60px}.intro{margin-bottom:20px}
h1{font-size:clamp(25px,4vw,34px);letter-spacing:-.03em;margin:0 0 10px}h2{font-size:21px;margin:0 0 8px}
p{line-height:1.6;color:#59606a}.panel{background:white;border:1px solid #e7e8eb;border-radius:17px;padding:20px;margin-bottom:16px;box-shadow:0 3px 18px #00000005}
.filters{display:grid;grid-template-columns:minmax(210px,2fr) repeat(2,minmax(130px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#60666e}
input,select,button{border-radius:10px;border:1px solid #d4d8de;font:inherit;padding:12px;background:#fff;min-height:43px}
input:focus,select:focus{outline:2px solid #0071e3;outline-offset:1px}button{cursor:pointer;border:0;background:#0071e3;color:#fff;font-weight:600}button:disabled{background:#ccd0d6;cursor:default}
.action{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}.muted{color:#69717d;font-size:13px}
.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid #eee;padding:17px 0}.row:last-child{border-bottom:0}
.row h3{margin:0 0 7px;font-size:17px}.row p{font-size:14px;margin:3px 0}.badge{font-size:12px;color:#536478;background:#f1f4f8;border-radius:6px;padding:5px 7px;white-space:nowrap}
nav{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:14px}
nav button{min-width:88px}#status{font-size:14px}#status[aria-invalid=true]{color:#bb1e2f}
#detail[hidden],#results[hidden]{display:none}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
pre{font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f7f9;padding:15px;border-radius:10px}
@media(max-width:680px){.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}main{margin:22px auto}.panel{padding:16px}}
</style>
</head>
<body>
<header><strong>標案情報 · HF 公開資料</strong><a href="./">返回標案平台</a></header>
<main>
 <section class="intro">
  <h1>政府標案公開資料查詢</h1>
  <p>資料來源：<a href="https://huggingface.co/datasets/hub-google/TenderIntelligence" target="_blank" rel="noopener noreferrer">Hugging Face 公開 Repository</a>。直接讀取 HF Repository 的公開分片，不經 Supabase 或 Cloudflare Worker。這是獨立驗收頁，資料更新以公開封存時間為準。</p>
 </section>
 <section class="panel" id="searchPanel">
  <form id="searchForm">
   <div class="filters">
    <label>關鍵字<input id="query" placeholder="輸入標案名稱、機關或案號" maxlength="80" autocomplete="off"></label>
    <label>採購分類<select id="group"><option value="">全部</option><option>工程</option><option>財物</option><option>勞務</option><option>未分類</option></select></label>
    <label>最低預算（元）<input type="number" id="minBudget" min="0" step="1" placeholder="不限"></label>
    <label>公告起日<input type="date" id="start"></label>
    <label>公告迄日<input type="date" id="end"></label>
   </div>
   <div class="action"><span class="muted">關鍵字、分類、日期和預算在瀏覽器依原始資料一起篩選；完整筆數與分頁均來自公開快照。</span><button id="submit" type="submit">查詢公開標案</button></div>
  </form>
 </section>
 <section class="panel" id="results">
  <div class="detail-head"><h2>查詢結果</h2><span id="count" class="muted"></span></div>
  <p id="status" role="status" aria-live="polite">資料載入中…</p>
  <div id="list"></div>
  <nav><button id="prev" type="button">上一頁</button><span id="pageInfo" class="muted"></span><button id="next" type="button">下一頁</button></nav>
 </section>
 <section class="panel" id="detail" hidden>
  <div class="detail-head"><h2 id="detailTitle">案件詳情</h2><button type="button" id="closeDetail">返回列表</button></div>
  <p id="detailStatus" role="status"></p>
  <div id="detailBody"></div>
 </section>
</main>
<script type="module">
import {hfReady,hfCaseSearch,hfArchivedCaseDetail} from './hf-static-source.mjs';
const $=id=>document.getElementById(id);
let page=1,lastTotal=0;
function money(n){return n==null?'未公開':Number(n).toLocaleString('zh-TW')+' 元';}
function node(tag,value='',cls=''){
 const n=document.createElement(tag);n.textContent=String(value??'');if(cls)n.className=cls;return n;
}
function getForm(){
 const query=$('query').value.trim(),group=$('group').value,min=$('minBudget').value;
 const start=$('start').value,end=$('end').value;
 if(start&&end&&start>end)throw Error('公告起日不得晚於迄日');
 return {query,filters:{group:group||'全部',minBudget:min,dateStart:start,dateEnd:end}};
}
async function run(){
 let arg;try{arg=getForm();}catch(e){$('status').textContent=e.message;return;}
 $('submit').disabled=true;$('status').textContent='正在讀取 Hugging Face 公開索引…';
 $('status').removeAttribute('aria-invalid');$('list').replaceChildren();
 try{
  const result=await hfCaseSearch({mode:arg.query?'title':'latest',query:arg.query,
    filters:arg.filters,page});
  lastTotal=result.total_records;
  $('status').textContent=result.records.length?'已從 HF 公開資料完成查詢。':'目前沒有符合的公告案件。';
  $('count').textContent='符合 '+lastTotal.toLocaleString('zh-TW')+' 筆';
  const fragment=document.createDocumentFragment();
  for(const item of result.records){
   const id=item.unit_id+'::'+item.job_number;
   const el=node('article','','row'),left=node('div');
   const title=node('a',item.brief?.title||'未提供案名');
   title.href='#case='+encodeURIComponent(id);
   title.addEventListener('click',e=>{e.preventDefault();void openDetail(item.unit_id,item.job_number);});
   const titleEl=node('h3');titleEl.append(title);left.append(titleEl);
   left.append(node('p',(item.unit_name||'機關未公開')+'　·　'+(item.date||'日期不明')));
   left.append(node('p','案號：'+item.job_number+'　·　預算：'+money(item.budget_amount)));
   el.append(left,node('span',item.brief?.category||'未分類','badge'));fragment.append(el);
  }
  $('list').replaceChildren(fragment);
  $('prev').disabled=page<=1;$('next').disabled=page*30>=lastTotal;
  $('pageInfo').textContent='第 '+page+' / '+result.total_pages+' 頁';
 }catch(e){
  $('status').textContent='HF 讀取失敗：'+String(e.message||e);
  $('status').setAttribute('aria-invalid','true');
  $('prev').disabled=$('next').disabled=true;$('count').textContent='';
 }finally{$('submit').disabled=false;}
}
async function openDetail(unit,job){
 $('results').hidden=true;$('searchPanel').hidden=true;$('detail').hidden=false;
 $('detailTitle').textContent='案件詳情';$('detailStatus').textContent='讀取 HF 公開公告歷史…';$('detailBody').replaceChildren();
 try{
  const result=await hfArchivedCaseDetail(unit,job);
  const first=result.records[0];
  $('detailTitle').textContent=first?.brief?.title||'案件詳情';
  $('detailStatus').textContent='機關：'+(result.unit_name||'未公開')+'　公告歷史：'+result.records.length+' 筆';
  const frag=document.createDocumentFragment();
  frag.append(node('p','機關代碼：'+unit+'　案號：'+job));
  frag.append(node('p','預算：'+money(first?.budget_amount)));
  frag.append(node('h3','公告歷史'));
  for(const rec of result.records){
   const row=node('article','','row'),left=node('div');
   left.append(node('p',(rec.date||'日期不明')+'　'+(rec.brief?.type||'公告')));
   left.append(node('p',rec.brief?.title||'原公告未提供案名'));
   const evidence=rec.detail||{};
   for(const field of ['採購資料:履約地點','採購資料:履約期限','採購資料:招標方式']){
    if(evidence[field])left.append(node('p',field.split(':')[1]+'：'+evidence[field]));
   }
   if(evidence.url&&String(evidence.url).startsWith('https://')){
    const link=node('a','查看政府原始公告');link.href=evidence.url;link.target='_blank';link.rel='noopener noreferrer';left.append(link);
   }
   row.append(left);frag.append(row);
  }
  $('detailBody').replaceChildren(frag);
 }catch(e){$('detailStatus').textContent='HF 案件歷史讀取失敗：'+String(e.message||e);}
}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();page=1;void run();});
$('prev').addEventListener('click',()=>{if(page>1){page--;void run();}});
$('next').addEventListener('click',()=>{if(page*30<lastTotal){page++;void run();}});
$('closeDetail').addEventListener('click',()=>{$('detail').hidden=true;$('searchPanel').hidden=false;$('results').hidden=false;});
void hfReady().then(()=>run(),()=>run());
</script>
</body>
</html>
