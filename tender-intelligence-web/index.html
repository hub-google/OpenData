<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>政府標案情報平台｜OpenData Lab</title>
<style>
:root{--nav:#101828;--bg:#f5f7fa;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e7ec;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:#98a2b3;line-height:1.6;margin-top:8px}.nav{margin-top:30px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px;border-radius:9px;text-align:left;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1d2939;color:#fff}
.main{padding:26px 30px 50px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:16px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px}.top h1{margin:5px 0 6px;font-size:28px}.muted{color:var(--muted);font-size:13px}.pill{background:#eef4ff;color:#1849a9;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700;height:fit-content}.notice{margin:18px 0;background:#fffaeb;border:1px solid #fedf89;padding:11px 14px;border-radius:10px;font-size:12px;color:#7a2e0e}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.stat{padding:16px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:6px}.panel{margin-top:14px;padding:16px}.filters{display:grid;grid-template-columns:1.5fr repeat(4,1fr) auto;gap:10px}.filters input,.filters select{border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff;width:100%}.btn{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.tablehead,.row{display:grid;grid-template-columns:70px 1.7fr 1.1fr .9fr .9fr 1fr 44px;align-items:center;gap:10px}.tablehead{padding:12px 10px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}.row{padding:13px 10px;border-bottom:1px solid #f0f2f5}.row:hover{background:#f9fafb}.score{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;background:#eff8ff;color:#175cd3}.score.hot{background:#ecfdf3;color:#027a48}.name{border:0;background:none;padding:0;font-size:14px;font-weight:750;cursor:pointer;text-align:left}.small{font-size:11px;color:var(--muted);margin-top:4px}.metric span{display:block;font-size:11px;color:var(--muted)}.metric b{font-size:13px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:11px}.star{font-size:22px;background:none;border:0;color:#f59e0b;cursor:pointer}
.drawerback{position:fixed;inset:0;background:#10182870}.drawer{position:fixed;right:0;top:0;width:min(540px,92vw);height:100vh;background:#fff;padding:26px;overflow:auto;box-shadow:-12px 0 30px #0002}.hidden{display:none}.close{float:right;border:0;background:#f2f4f7;width:36px;height:36px;border-radius:9px;cursor:pointer}.reason{background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:9px;margin:8px 0;font-size:13px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail>div{border:1px solid var(--line);padding:11px;border-radius:9px}.detail span{display:block;color:var(--muted);font-size:11px}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.tablehead{display:none}.row{grid-template-columns:58px 1fr 1fr}.row .hide-sm{display:none}}@media(max-width:600px){.grid,.filters{grid-template-columns:1fr}.row{grid-template-columns:55px 1fr 40px}.row .metric,.row .tagwrap{display:none}}
</style></head>
<body><div class="shell">
<aside class="side"><div class="brand">OpenData Lab</div><div class="sub">Top 5 商業化原型<br>04｜政府標案情報平台</div><div class="nav"><button class="active">今日值得追</button><button onclick="showSaved()">追蹤標案</button><button onclick="location.href='../'">企業商機雷達</button></div></aside>
<main class="main"><div class="top"><div><div class="eyebrow">PUBLIC PROCUREMENT INTELLIGENCE</div><h1>政府標案情報平台</h1><div class="muted">不是另一個標案搜尋器，而是直接告訴你：今天哪些案值得追、誰常得標、下一次何時可能重買。</div></div><div class="pill">商業價值 89 / 100</div></div>
<div class="notice">MVP 示意版：以下標案與廠商為模擬資料。正式版應串政府採購決標資料、公司基本資料與歷史得標紀錄。</div>
<div class="grid"><div class="stat"><span>今日候選</span><strong id="sTotal">0</strong></div><div class="stat"><span>高匹配 ≥ 85</span><strong id="sHot">0</strong></div><div class="stat"><span>總預算</span><strong id="sBudget">—</strong></div><div class="stat"><span>近 90 天可能重購</span><strong id="sRenew">0</strong></div></div>
<section class="panel"><div class="filters">
<input id="q" placeholder="搜尋標案、機關或關鍵字">
<select id="industry"><option>網路設備</option><option>資安</option><option>醫療設備</option><option>教育科技</option><option>辦公設備</option></select>
<select id="agency"><option value="all">所有機關類型</option><option>中央機關</option><option>地方政府</option><option>學校</option><option>醫院</option></select>
<select id="minBudget"><option value="0">所有金額</option><option value="500">500 萬以上</option><option value="1000">1,000 萬以上</option><option value="3000">3,000 萬以上</option></select>
<select id="sort"><option value="score">依匹配分數</option><option value="budget">依預算</option><option value="deadline">依截止日</option></select>
<button class="btn" onclick="exportCsv()">匯出 CSV</button></div>
<div class="tablehead"><div>分數</div><div>標案</div><div>機關</div><div>預算</div><div>截止</div><div>競爭情報</div><div></div></div><div id="list"></div></section></main></div>
<div id="back" class="drawerback hidden" onclick="closeDrawer()"></div><aside id="drawer" class="drawer hidden"><button class="close" onclick="closeDrawer()">×</button><div id="drawerBody"></div></aside>
<script>
const tenders=[
{id:1,n:"核心交換器與網路設備汰換案",agency:"臺北市政府資訊局",type:"地方政府",cat:"網路設備",budget:2860,deadline:"2026-10-02",winner:"聯網科技",rival:"啟碁系統、宏達資訊",cycle:36,months:1,score:94,history:"近 3 次同類案皆由 3 家廠商輪流得標"},
{id:2,n:"資料中心零信任與資安設備建置",agency:"數位發展部",type:"中央機關",cat:"資安",budget:5200,deadline:"2026-10-08",winner:"安拓資訊",rival:"凌群、精誠",cycle:30,months:2,score:92,history:"近年資安預算逐年提高"},
{id:3,n:"校園無線網路升級採購",agency:"國立臺灣大學",type:"學校",cat:"網路設備",budget:1480,deadline:"2026-09-30",winner:"聯成科技",rival:"群環、神通",cycle:24,months:1,score:89,history:"多校區分批採購，過去兩年皆有續案"},
{id:4,n:"智慧病房資訊設備更新",agency:"臺北市立聯合醫院",type:"醫院",cat:"醫療設備",budget:3650,deadline:"2026-10-12",winner:"醫電科技",rival:"佳世達、神通",cycle:48,months:4,score:88,history:"歷史案偏好具醫療整合經驗廠商"},
{id:5,n:"國中小平板與教學平台擴充",agency:"新北市政府教育局",type:"地方政府",cat:"教育科技",budget:6100,deadline:"2026-10-15",winner:"宏碁資訊",rival:"台灣大哥大、遠傳",cycle:24,months:3,score:91,history:"大型採購通常分批次與後續維運"},
{id:6,n:"辦公電腦與顯示器汰換",agency:"財政部",type:"中央機關",cat:"辦公設備",budget:980,deadline:"2026-10-05",winner:"精誠資訊",rival:"宏碁、凌群",cycle:36,months:2,score:82,history:"固定週期汰換，需求可預測"},
{id:7,n:"區域網路防火牆更新",agency:"高雄市政府",type:"地方政府",cat:"資安",budget:1320,deadline:"2026-10-01",winner:"安碁資訊",rival:"中華電信、精誠",cycle:30,months:1,score:86,history:"過去得標集中於少數 SI"},
{id:8,n:"教學大樓網路骨幹更新",agency:"國立政治大學",type:"學校",cat:"網路設備",budget:760,deadline:"2026-09-28",winner:"群環科技",rival:"聯成、中華電信",cycle:36,months:1,score:87,history:"近一次標案金額較三年前成長"},
{id:9,n:"醫療影像儲存與伺服器擴充",agency:"臺中榮民總醫院",type:"醫院",cat:"醫療設備",budget:4380,deadline:"2026-10-20",winner:"神通資訊",rival:"佳世達、華電聯網",cycle:42,months:5,score:84,history:"既有系統相容性是重要進入門檻"},
{id:10,n:"分署端點資安與 EDR 授權",agency:"勞動部",type:"中央機關",cat:"資安",budget:2140,deadline:"2026-10-06",winner:"精誠資訊",rival:"安碁、敦陽",cycle:12,months:2,score:90,history:"訂閱授權型產品具年度續約機會"}
];
let saved=new Set(JSON.parse(localStorage.getItem("tender-radar-saved")||"[]")),current=[];const el=id=>document.getElementById(id);
function match(t){let s=t.score;if(t.cat===el("industry").value)s+=5;else s-=9;return Math.max(45,Math.min(99,s))}
function render(){const q=el("q").value.trim(),a=el("agency").value,min=+el("minBudget").value,sort=el("sort").value;current=tenders.filter(t=>(!q||(t.n+t.agency+t.cat).includes(q))&&(a==="all"||t.type===a)&&t.budget>=min);current.sort((x,y)=>sort==="budget"?y.budget-x.budget:sort==="deadline"?x.deadline.localeCompare(y.deadline):match(y)-match(x));el("list").innerHTML=current.map(t=>'<div class="row"><div class="score '+(match(t)>=90?"hot":"")+'">'+match(t)+'</div><div><button class="name" onclick="openDrawer('+t.id+')">'+t.n+'</button><div class="small">'+t.cat+' ・ '+t.type+'</div></div><div class="tagwrap"><span class="tag">'+t.agency+'</span></div><div class="metric"><span>預算</span><b>'+t.budget.toLocaleString()+' 萬</b></div><div class="metric hide-sm"><span>截止日</span><b>'+t.deadline.slice(5)+'</b></div><div class="metric hide-sm"><span>上次得標</span><b>'+t.winner+'</b></div><button class="star" onclick="toggleSave('+t.id+')">'+(saved.has(t.id)?"★":"☆")+'</button></div>').join("");el("sTotal").textContent=current.length;el("sHot").textContent=current.filter(t=>match(t)>=85).length;el("sBudget").textContent=(current.reduce((s,t)=>s+t.budget,0)/10000).toFixed(1)+" 億";el("sRenew").textContent=current.filter(t=>t.months<=3).length}
function openDrawer(id){const t=tenders.find(x=>x.id===id);el("drawerBody").innerHTML='<div class="eyebrow">'+t.type+' ・ '+t.cat+'</div><h2>'+t.n+'</h2><p class="muted">'+t.agency+'</p><div class="score" style="width:70px;height:70px;font-size:26px">'+match(t)+'</div><h3>競爭情報</h3><div class="reason">✓ 上次得標廠商：'+t.winner+'</div><div class="reason">✓ 主要競爭者：'+t.rival+'</div><div class="reason">✓ '+t.history+'</div><div class="detail"><div><span>預算</span><b>'+t.budget.toLocaleString()+' 萬</b></div><div><span>投標截止</span><b>'+t.deadline+'</b></div><div><span>歷史採購週期</span><b>約 '+t.cycle+' 個月</b></div><div><span>可能重購訊號</span><b>'+t.months+' 個月內</b></div></div>';el("back").classList.remove("hidden");el("drawer").classList.remove("hidden")}
function closeDrawer(){el("back").classList.add("hidden");el("drawer").classList.add("hidden")}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem("tender-radar-saved",JSON.stringify([...saved]));render()}
function showSaved(){current=tenders.filter(t=>saved.has(t.id));el("list").innerHTML=current.map(t=>'<div class="row"><div class="score">'+match(t)+'</div><div><button class="name" onclick="openDrawer('+t.id+')">'+t.n+'</button><div class="small">'+t.cat+'</div></div><div class="tagwrap"><span class="tag">'+t.agency+'</span></div><div class="metric"><span>預算</span><b>'+t.budget+' 萬</b></div><div class="metric hide-sm"><span>截止</span><b>'+t.deadline.slice(5)+'</b></div><div class="metric hide-sm"><span>上次得標</span><b>'+t.winner+'</b></div><button class="star" onclick="toggleSave('+t.id+')">★</button></div>').join("")}
function exportCsv(){const rows=[["標案","機關","類別","匹配分數","預算萬元","截止日","上次得標","競爭者"],...current.map(t=>[t.n,t.agency,t.cat,match(t),t.budget,t.deadline,t.winner,t.rival])];const csv="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="政府標案情報.csv";a.click()}
["q","industry","agency","minBudget","sort"].forEach(id=>el(id).addEventListener(id==="q"?"input":"change",render));render();
</script></body></html>
