function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(v){if(v===null||v===undefined||v==='')return null;const x=Number(String(v).replace(/,/g,''));return Number.isFinite(x)?x:null}
function first(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return null}
function idOf(o){return String(first(o,['id','ID','Id','parkId','ParkId','PARKID','parkingId','ParkingID','park_id'])??'')}
function availableNumber(v){const x=n(v);return x!==null&&x>=0?Math.trunc(x):null}
function extractArray(obj){
  if(Array.isArray(obj))return obj;
  if(!obj||typeof obj!=='object')return[];
  if(Array.isArray(obj.data))return obj.data;
  if(obj.data&&typeof obj.data==='object'){
    for(const k of ['park','records','items'])if(Array.isArray(obj.data[k]))return obj.data[k];
  }
  if(obj.result&&typeof obj.result==='object'){
    for(const k of ['records','items'])if(Array.isArray(obj.result[k]))return obj.result[k];
  }
  for(const k of ['records','items'])if(Array.isArray(obj[k]))return obj[k];
  return[];
}
function withBust(url){return url+(url.includes('?')?'&':'?')+'_ts='+Date.now()}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function getJSON(url,maxAttempts=3){
  let lastError=null;
  for(let attempt=1;attempt<=maxAttempts;attempt++){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),10000);
    try{
      const r=await fetch(withBust(url),{cache:'no-store',signal:controller.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){
      lastError=e;
      if(attempt<maxAttempts)await sleep(attempt*500);
    }finally{clearTimeout(timer)}
  }
  throw new Error('API 連續 '+maxAttempts+' 次失敗：'+(lastError?.message||'unknown error'));
}
async function getPagedJSON(base){const merged=[],seen=new Set();for(let page=0;page<5;page++){const data=await getJSON(base+'?page='+page+'&size=1000');const rows=extractArray(data);const sig=JSON.stringify(rows.slice(0,3));if(!rows.length||seen.has(sig))break;seen.add(sig);merged.push(...rows);if(rows.length<1000)break}return merged}

}

function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(q){
      if(ch==='"'&&next==='"'){cell+='"';i++}
      else if(ch==='"')q=false;
      else cell+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cell);cell=''}
      else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}
      else cell+=ch;
    }
  }
  if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}
  if(!rows.length)return[];
  const head=rows[0].map(x=>x.trim());
  return rows.slice(1).filter(r=>r.some(x=>String(x||'').trim())).map(r=>{
    const o={};head.forEach((h,i)=>o[h]=r[i]??'');return o;
  });
}
function coordPair(v){
  const nums=String(v||'').match(/-?\d+(?:\.\d+)?/g)?.map(Number)||[];
  if(nums.length<2)return null;
  for(let i=0;i<nums.length-1;i++){
    const a=nums[i],b=nums[i+1];
    if(a>20&&a<27&&b>118&&b<123)return[a,b];
    if(b>20&&b<27&&a>118&&a<123)return[b,a];
  }
  return null;
}

function twd97ToWgs84(x,y){
  x=Number(x);y=Number(y);if(!Number.isFinite(x)||!Number.isFinite(y)||x===0||y===0)return null;
  const a=6378137.0,b=6356752.314245,lng0=121*Math.PI/180,k0=0.9999,dx=250000;
  x-=dx;
  const e=Math.sqrt(1-(b*b)/(a*a)),M=y/k0;
  const mu=M/(a*(1-e*e/4-3*Math.pow(e,4)/64-5*Math.pow(e,6)/256));
  const e1=(1-Math.sqrt(1-e*e))/(1+Math.sqrt(1-e*e));
  const J1=3*e1/2-27*Math.pow(e1,3)/32,J2=21*e1*e1/16-55*Math.pow(e1,4)/32,J3=151*Math.pow(e1,3)/96,J4=1097*Math.pow(e1,4)/512;
  const fp=mu+J1*Math.sin(2*mu)+J2*Math.sin(4*mu)+J3*Math.sin(6*mu)+J4*Math.sin(8*mu);
  const e2=e*e/(1-e*e),C1=e2*Math.pow(Math.cos(fp),2),T1=Math.pow(Math.tan(fp),2);
  const R1=a*(1-e*e)/Math.pow(1-e*e*Math.pow(Math.sin(fp),2),1.5),N1=a/Math.sqrt(1-e*e*Math.pow(Math.sin(fp),2)),D=x/(N1*k0);
  const lat=fp-(N1*Math.tan(fp)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*e2)*Math.pow(D,4)/24+(61+90*T1+298*C1+45*T1*T1-252*e2-3*C1*C1)*Math.pow(D,6)/720);
  const lng=lng0+(D-(1+2*T1+C1)*Math.pow(D,3)/6+(5-2*C1+28*T1-3*C1*C1+8*e2+24*T1*T1)*Math.pow(D,5)/120)/Math.cos(fp);
  const out=[lat*180/Math.PI,lng*180/Math.PI];
  return out[0]>20&&out[0]<27&&out[1]>118&&out[1]<123?out:null;
}
function coordFromRow(p){
  const info=p?.EntranceCoord?.EntrancecoordInfo?.[0];
  const pairs=[
    [first(p,['lat','Lat','LAT','latitude','Latitude']),first(p,['lng','Lng','LNG','lon','Lon','longitude','Longitude'])],
    [first(p,['wgsX','WGSX','WgsX']),first(p,['wgsY','WGSY','WgsY'])],
    [first(p,['Y','y']),first(p,['X','x'])],
    [info?.Xcod,info?.Ycod]
  ];
  for(const [a0,b0] of pairs){
    const a=n(a0),b=n(b0);if(a===null||b===null)continue;
    if(a>20&&a<27&&b>118&&b<123)return[a,b];
    if(b>20&&b<27&&a>118&&a<123)return[b,a];
  }
  return twd97ToWgs84(first(p,['tw97x','TW97X','Tw97X']),first(p,['tw97y','TW97Y','Tw97Y']));
}
function hav(lat1,lng1,lat2,lng2){
  const R=6371000,toRad=x=>x*Math.PI/180,dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function sourceTime(p){
  return first(p,['update_time','UpdateTime','UPDATETIME','updateTime','updated_at','UpdatedAt','dataTime','DataTime','time','TIME']);
}
function inBBox(pos,bbox,padKm){
  const latPad=padKm/111,lngPad=padKm/(111*Math.max(.2,Math.cos(pos[0]*Math.PI/180)));
  return pos[0]>=bbox[0]-latPad&&pos[0]<=bbox[1]+latPad&&pos[1]>=bbox[2]-lngPad&&pos[1]<=bbox[3]+lngPad;
}
async function directPair(cfg){
  const [s,r]=cfg.paged?await Promise.all([getPagedJSON(cfg.static),getPagedJSON(cfg.realtime)]):await Promise.all([getJSON(cfg.static),getJSON(cfg.realtime)]);
  return{s,r,mode:'官方 API 直連'};
}
async function loadTaipei(){
  const cfg=API.taipei,res=await directPair(cfg),stat=extractArray(res.s),live=extractArray(res.r);
  const lm=new Map(live.map(x=>[idOf(x),x]).filter(x=>x[0]));
  const rows=[];
  for(const p of stat){
    const c=coordFromRow(p);if(!c)continue;const rt=lm.get(idOf(p));
    const av=availableNumber(first(rt,['availablecar','availableCar','AvailableCar','AVAILABLECAR','available','Available']));
    rows.push({id:'tp-'+idOf(p),name:first(p,['name','Name','NAME'])||'未命名停車場',area:first(p,['area','Area','AREA'])||'',address:first(p,['address','Address','ADDRESS'])||'',lat:c[0],lng:c[1],total:n(first(p,['totalcar','totalCar','TotalCar','TOTALCAR'])),avail:av,fee:first(p,['payex','PayEx','PAYEX','fee','Fee'])||'',source:'臺北市政府',sourceMode:res.mode,hasRealtime:av!==null,updated:sourceTime(rt),official:cfg.official});
  }
  return{key:'taipei',rows,mode:res.mode};
}
async function loadNtpc(){
  const cfg=API.ntpc,res=await directPair(cfg),stat=extractArray(res.s),live=extractArray(res.r);
  const lm=new Map(live.map(x=>[idOf(x),x]).filter(x=>x[0]));
  const rows=[];
  for(const p of stat){
    const c=coordFromRow(p);if(!c)continue;const rt=lm.get(idOf(p));
    const av=availableNumber(first(rt,['AVAILABLECAR','AvailableCar','availableCar','availablecar','AVAILABLE','available','surplusSpace']));
    rows.push({id:'ntpc-'+idOf(p),name:first(p,['NAME','Name','name','parkName','PARKINGNAME'])||'未命名停車場',area:first(p,['AREA','Area','area','areaName'])||'',address:first(p,['ADDRESS','Address','address'])||'',lat:c[0],lng:c[1],total:n(first(p,['TOTALCAR','TotalCar','totalCar','totalSpace','TOTALSPACE'])),avail:av,fee:first(p,['PAYEX','PayEx','payex','payGuide','FEE','fee'])||'',source:'新北市政府',sourceMode:res.mode,hasRealtime:av!==null,updated:sourceTime(rt),official:cfg.official});
  }
  return{key:'ntpc',rows,mode:res.mode};
}
async function loadTaoyuan(){
  const cfg=API.taoyuan,raw=await getJSON(cfg.data),mode='官方 API 直連';
  const rows=extractArray(raw).map(p=>{
    const c=coordFromRow(p),av=availableNumber(first(p,['surplusSpace','AVAILABLECAR','availableCar','available']));

    return{id:'ty-'+idOf(p),name:first(p,['parkName','name','NAME'])||'未命名停車場',area:first(p,['areaName','area','AREA'])||'',address:first(p,['address','ADDRESS'])||'',lat:c[0],lng:c[1],total:n(first(p,['totalSpace','TOTALSPACE','totalCar'])),avail:av,fee:first(p,['payGuide','PAYGUIDE','fee','payex'])||'',source:'桃園市政府',sourceMode:mode,hasRealtime:av!==null,updated:sourceTime(p),official:cfg.official};
  }).filter(Boolean);
  return{key:'taoyuan',rows,mode};
}


function normalizedRow(p,opt){
  const coord=opt.coord||coordFromRow(p); if(!coord)return null;
  const av=availableNumber(opt.avail), total=n(opt.total);
  const fallbackId=[opt.source||'src',opt.name||'unknown',coord[0],coord[1]].join('|');
  return {id:String(opt.id||fallbackId),name:opt.name||'未命名停車場',area:opt.area||'',address:opt.address||'',lat:coord[0],lng:coord[1],total,avail:av,fee:opt.fee||'',source:opt.source,sourceMode:'官方 API 直連',hasRealtime:av!==null,updated:opt.updated||null,official:opt.official};
}

async function loadTaitung(radius){
  const cfg=API.taitung,raw=await getJSON(cfg.lots),lots=extractArray(raw.data||raw);
  const candidates=lots.map(p=>{
    const lat=n(first(p,['PositionLat','lat'])),lng=n(first(p,['PositionLon','lng','lon']));
    if(lat===null||lng===null)return null;
    const dist=hav(userPos[0],userPos[1],lat,lng);
    return{p,lat,lng,dist};
  }).filter(Boolean).filter(x=>x.dist<=radius+3000).sort((a,b)=>a.dist-b.dist).slice(0,30);
  const details=await Promise.allSettled(candidates.map(x=>getJSON(cfg.lots+'/'+encodeURIComponent(first(x.p,['id','ID'])))));
  const rows=[];
  details.forEach((res,i)=>{
    if(res.status!=='fulfilled')return;
    const d=res.value?.data||res.value||{},x=candidates[i];
    const detailId=first(d,['id','ID']) ?? first(x.p,['id','ID']) ?? i;
    const row=normalizedRow(d,{coord:[n(first(d,['lat']))??x.lat,n(first(d,['lng','lon']))??x.lng],id:'tt-'+detailId,name:first(d,['name','Name'])||'臺東停車場',
      address:first(d,['address','Address']),total:first(d,['total','TOTALCAR']),avail:first(d,['vacancy','available']),fee:first(d,['charge','fee']),updated:first(d,['updated_at','UpdateTime']),source:'臺東縣政府',official:cfg.official});
    if(row)rows.push(row);
  });
  return{key:'taitung',rows,mode:'官方 API 直連'};
}

function candidateSources(pos,radiusM){
  const pad=Math.max(5,radiusM/1000+3),out=[];
  for(const [key,cfg] of Object.entries(API))if(inBBox(pos,cfg.bbox,pad))out.push(key);
  return out;
}
async function loadSource(key,radius){
  if(key==='taipei')return loadTaipei();
  if(key==='ntpc')return loadNtpc();
  if(key==='taoyuan')return loadTaoyuan();
  if(key==='tainan')return loadTainan();
  if(key==='hsinchuCity')return loadHsinchuCity();
  if(key==='kaohsiung')return loadKaohsiung();
  if(key==='changhua')return loadChanghua();
  if(key==='yilan')return loadYilan();
  if(key==='taitung')return loadTaitung(radius);
  if(key==='penghu')return loadPenghu();
  if(key==='yunlin')return loadSimpleParkingLotPost('yunlin','雲林縣政府');
  if(key==='nantou')return loadSimpleParkingLotPost('nantou','南投縣政府');
  if(key==='hualien')return loadHualien();
  if(key==='taichung')return loadTaichung();
  if(key==='chiayiCity')return loadChiayiCity();
  if(key==='pingtungHengchun')return loadPingtungHengchun();
  throw new Error('unknown source '+key);
}
async function refreshNearby(){
  if(!userPos||loading)return;
  loading=true;
  document.getElementById('status').className='status';
  document.getElementById('status').innerHTML='正在向附近政府即時 API 取得最新車位…';
  document.getElementById('list').innerHTML='<div class="loading">載入中…</div>';
  try{
    const radius=Number(document.getElementById('radius').value);
    const keys=candidateSources(userPos,radius);
    if(!keys.length){
      allData=[];lastSources=[];render();
      document.getElementById('status').innerHTML='<strong>目前此位置尚未接入地方政府即時來源</strong><br>已接來源：臺北、新北、桃園、臺中、臺南、新竹市、高雄、彰化、宜蘭、臺東、澎湖、雲林、南投、花蓮、嘉義市、屏東恆春。';
      return;
    }
    const settled=await Promise.allSettled(keys.map(key=>loadSource(key,radius)));
    const ok=settled.filter(x=>x.status==='fulfilled').map(x=>x.value);
    const bad=settled.map((x,i)=>({result:x,key:keys[i]})).filter(x=>x.result.status==='rejected');
    lastSources=ok;
    allData=ok.flatMap(x=>x.rows).map(x=>({...x,dist:hav(userPos[0],userPos[1],x.lat,x.lng)})).filter(x=>x.dist<=radius).sort((a,b)=>a.dist-b.dist);
    render();
    const parts=ok.map(x=>API[x.key].label+'：'+x.mode);
    const failed=bad.map(x=>API[x.key].label+'：'+(x.result.reason?.message||'連續 3 次失敗')).join('；');
    document.getElementById('status').className=bad.length?'status error':'status';
    document.getElementById('status').innerHTML='<strong>已即時查詢 '+ok.length+' / '+keys.length+' 個政府來源</strong><br>'+esc(parts.join('；'))+(failed?'<br><b>失敗：</b>'+esc(failed):'');
  }catch(e){
    allData=[];render();
    document.getElementById('status').className='status error';
    document.getElementById('status').innerHTML='<strong>附近資料載入失敗</strong><br>'+esc(e.message)+'。沒有使用假資料。';
  }finally{loading=false}
}

function filteredRows(){
  let rows=allData.filter(x=>{
    const q=query.toLowerCase();
    const hit=!q||[x.name,x.area,x.address,x.source].some(v=>String(v||'').toLowerCase().includes(q));
    if(!hit)return false;
    if(filter==='available')return x.avail!==null&&x.avail>0;
    if(filter==='realtime')return x.hasRealtime;
    if(filter==='free')return String(x.fee||'').includes('免費');
    return true;
  });
  return rows.sort((a,b)=>a.dist-b.dist);
}
function availLabel(x){
  if(x.avail===null)return'<span class="available unknown">無即時數字</span>';
  if(x.avail===0)return'<span class="available full">0 格</span>';
  return'<span class="available">剩 '+x.avail+' 格</span>';
}
function cardHTML(x){
  const dist=x.dist<1000?Math.round(x.dist)+'m':(x.dist/1000).toFixed(1)+'km';
  const upd=x.updated?' ・ 官方更新 '+esc(x.updated):'';
  return '<div class="card" data-id="'+esc(x.id)+'"><div class="row"><span class="name">'+esc(x.name)+'</span>'+availLabel(x)+'</div>'+
    '<div class="muted">'+esc([x.area,x.address].filter(Boolean).join(' ・ '))+' ・ '+dist+'</div>'+
    '<div class="muted">'+esc(x.fee||'費率未提供')+upd+'</div>'+
    '<div class="chips">'+
      (x.total!==null?'<span class="chip">總 '+esc(x.total)+' 格</span>':'')+
      '<span class="chip '+(x.sourceMode.includes('直連')?'live':'cached')+'">'+esc(x.source)+'｜'+esc(x.sourceMode)+'</span>'+
    '</div></div>';
}
function popupHTML(x){
  const nav='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(x.lat+','+x.lng);
  return '<b>'+esc(x.name)+'</b><br>'+esc(x.address||x.area)+'<br>'+(x.avail===null?'剩餘：無即時數字':'剩餘：'+x.avail+' 格')+'<br>'+esc(x.source)+'｜'+esc(x.sourceMode)+'<br><a target="_blank" rel="noopener" href="'+nav+'">Google Maps 導航</a>';
}
function render(){
  const rows=filteredRows();
  document.getElementById('summary').textContent=userPos?'附近 '+rows.length+' 筆，已依距離排序':'尚未定位';
  document.getElementById('list').innerHTML=rows.length?rows.slice(0,300).map(cardHTML).join(''):'<div class="empty">'+(userPos?'搜尋半徑內沒有符合條件的停車場。':'請先定位。')+'</div>';
  layer.clearLayers();
  rows.forEach(x=>{
    let color='#64748b';if(x.avail===0)color='#dc2626';else if(x.avail>0)color='#16a34a';
    L.circleMarker([x.lat,x.lng],{radius:5,weight:1,color,fillColor:color,fillOpacity:.78}).bindPopup(popupHTML(x)).addTo(layer).parkingId=x.id;
  });
  document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{
    const x=rows.find(v=>v.id===el.dataset.id);if(!x)return;map.setView([x.lat,x.lng],17);layer.eachLayer(m=>{if(m.parkingId===x.id)m.openPopup()});
  });
}
function setUserPosition(lat,lng){
  userPos=[lat,lng];userLayer.clearLayers();
  L.circleMarker(userPos,{radius:7,weight:2,color:'#2563eb',fillColor:'#60a5fa',fillOpacity:.9}).addTo(userLayer).bindPopup('你的位置');
  map.setView(userPos,14);
}

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim();render()});
document.getElementById('radius').addEventListener('change',()=>{if(userPos)refreshNearby()});
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});
document.getElementById('locate').onclick=()=>{
  if(!navigator.geolocation){alert('瀏覽器不支援定位');return}
  document.getElementById('status').innerHTML='正在取得定位…';
  navigator.geolocation.getCurrentPosition(p=>{setUserPosition(p.coords.latitude,p.coords.longitude);refreshNearby()},()=>alert('無法取得定位，請確認瀏覽器定位權限。'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
};
document.getElementById('refresh').onclick=()=>{if(!userPos){document.getElementById('locate').click();return}refreshNearby()};
</script>
